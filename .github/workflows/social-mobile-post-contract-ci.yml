name: Jynlo social notification post contract CI

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/social-mobile-post-contract-ci.yml'
      - 'src/main/java/com/example/desporto24/service/SocialFeedService.java'
      - 'src/main/java/com/example/desporto24/service/SocialStoryService.java'
      - 'src/main/java/com/example/desporto24/service/SocialStoryNotificationDispatcher.java'
      - 'src/main/java/com/example/desporto24/service/UserBlockService.java'
      - 'src/main/java/com/example/desporto24/service/SocialPostInteractionService.java'
      - 'src/main/java/com/example/desporto24/controllers/SocialFeedController.java'
      - 'src/main/java/com/example/desporto24/register/Notifications/Notifications.java'
      - 'src/main/resources/db/changelog/changes/2026-11-10-social-post-notification-links.yaml'
      - 'src/test/java/com/example/desporto24/service/SocialFeedPostDeepLinkTest.java'
      - 'src/test/java/com/example/desporto24/service/SocialFeedAttendanceVisibilityTest.java'
      - 'src/test/java/com/example/desporto24/service/SocialStoryServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/SocialPostNotificationLinkTest.java'
      - 'src/test/java/com/example/desporto24/register/Notifications/NotificationGifSerializationTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-post-contracts:
    name: Verify social post links, stories and attendance privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run social notifications and privacy regression tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SocialFeedPostDeepLinkTest,SocialPostNotificationLinkTest,NotificationGifSerializationTest,SocialFeedAttendanceVisibilityTest,SocialStoryServiceTest test
