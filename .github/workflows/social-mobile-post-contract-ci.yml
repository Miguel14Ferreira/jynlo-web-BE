name: Jynlo social notification post contract CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-post-contracts:
    name: Verify social post links, stories and attendance privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run social notifications and privacy regression tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SocialFeedPostDeepLinkTest,SocialPostNotificationLinkTest,NotificationGifSerializationTest,SocialFeedAttendanceVisibilityTest,SocialFeedSessionMemoriesTest,SocialStoryServiceTest test
