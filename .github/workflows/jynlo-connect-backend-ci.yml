name: Jynlo Connect backend safety CI
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: connect-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connect-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate calls, participants and provider revocation
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=DirectCallServiceTest test
