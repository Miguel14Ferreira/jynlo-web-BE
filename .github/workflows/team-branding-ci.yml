name: Jynlo global team branding validation

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/team-branding-ci.yml'
      - 'src/main/java/com/example/desporto24/model/team/SportsTeam.java'
      - 'src/main/java/com/example/desporto24/controllers/SportsTeamController.java'
      - 'src/main/java/com/example/desporto24/service/SportsTeamService.java'
      - 'src/test/java/com/example/desporto24/service/SportsTeamBrandingServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentTeamServiceTest.java'
      - 'src/main/resources/db/changelog/changes/2026-11-16-sports-team-branding.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test owner permissions, kit colors, and media storage
        run: |
          chmod +x ./mvnw
          ./mvnw -B -q -Dtest=SportsTeamBrandingServiceTest,CommunityTournamentTeamServiceTest test
