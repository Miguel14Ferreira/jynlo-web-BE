name: Jynlo global team branding validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test owner permissions, kit colors, and media storage
        run: |
          chmod +x ./mvnw
          ./mvnw -B -q -Dtest=SportsTeamBrandingServiceTest,CommunityTournamentTeamServiceTest test
