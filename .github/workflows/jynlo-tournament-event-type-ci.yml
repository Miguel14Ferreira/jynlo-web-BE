name: Jynlo tournament event type contract CI
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate tournament request, DTO, persistence and event contracts
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp -Dtest=CommunityTournamentServiceTest,CommunityTournamentControllerTest,CommunityTournamentPersistenceTest,CommunityTournamentTimedServiceTest,CommunityTimedStandingsTest,CommunityFieldDisciplinesTest,CommunityMeasuredStandingsTest,CommunityTournamentMeasuredServiceTest,CommunityRelayStandingsTest,CommunityTournamentRelayServiceTest,CommunityTournamentRaceServiceTest,CommunityRoundEventTypeTest,CommunityCanoeSprintResultsTest,CommunityRowingResultsTest,CommunityRaceStandingsTest,CommunityCompetitionServiceTest,CreateCommunityRoundSeasonRequestTest,CommunityRoundSeasonPolicyTest,CommunityImportSeasonValidationTest,CommunitySeasonCreationPolicyTest,CommunityMatchPointsSportTest,CommunityTournamentTeamScheduleServiceTest,CommunityTournamentTeamServiceTest,CommunityGolfStrokeResultsTest,CommunityTournamentGolfEventTypeTest,CommunityGolfTournamentStandingsTest,CommunityGolfTournamentRoundAdapterTest,CommunityGolfRoundPreviewServiceTest test
