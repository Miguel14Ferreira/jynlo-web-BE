name: Jynlo championship plan policy CI
on:
  workflow_dispatch:

jobs:
  policy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AES_ENCRYPTION_KEY: abc123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test championship entitlement policy
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=CommunityChampionshipPlanPolicyTest,ChampionshipCustomScoringPolicyTest,ChampionshipCustomScoringPersistenceContractTest,CommunityChampionshipServiceTest,ChampionshipWinnerStandingsTest,ChampionshipPlacementPointsPolicyTest,ChampionshipFinalizationPolicyTest,CommunityChampionshipStandingsCalculatorTest,CommunityChampionshipTeamsServiceTest,CommunityChampionshipHonoursTest,CommunityPermanentTeamsServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
