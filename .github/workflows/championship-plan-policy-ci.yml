name: Jynlo championship plan policy CI
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/championship-plan-policy-ci.yml'
      - 'src/test/java/com/example/desporto24/controllers/SessionControllerTest.java'
      - 'src/test/java/com/example/desporto24/service/SessionTeamSuggestionServiceTest.java'
      - 'src/main/java/com/example/desporto24/service/CommunityChampionshipPlanPolicy.java'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipPlanPolicyTest.java'
      - 'src/main/java/com/example/desporto24/service/ChampionshipCustomScoringPolicy.java'
      - 'src/test/java/com/example/desporto24/service/ChampionshipCustomScoringPolicyTest.java'
      - 'src/test/java/com/example/desporto24/service/ChampionshipCustomScoringPersistenceContractTest.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournament.java'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/main/resources/db/changelog/changes/2026-11-08-community-championship-custom-rules.yaml'
      - 'src/main/java/com/example/desporto24/service/CommunityChampionshipService.java'
      - 'src/main/java/com/example/desporto24/service/ChampionshipFinalizationPolicy.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityChampionshipStandingsResponse.java'
      - 'src/main/resources/db/changelog/changes/2026-11-09-community-championship-finalization.yaml'
      - 'src/test/java/com/example/desporto24/service/ChampionshipFinalizationPolicyTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipStandingsCalculatorTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipTeamsServiceTest.java'
      - 'src/main/java/com/example/desporto24/controllers/CommunityChampionshipController.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityChampionship.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityChampionshipRepository.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityChampionshipResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CreateCommunityChampionshipRequest.java'
      - 'src/main/resources/db/changelog/changes/2026-11-08-community-championships.yaml'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/ChampionshipWinnerStandingsTest.java'
      - 'src/test/java/com/example/desporto24/service/ChampionshipPlacementPointsPolicyTest.java'
      - 'src/main/java/com/example/desporto24/service/ChampionshipPlacementPointsPolicy.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/ChampionshipPlacementPointsRequest.java'
      - 'src/main/resources/db/changelog/changes/2026-11-09-community-championship-placement-points.yaml'
      - 'src/main/java/com/example/desporto24/service/ChampionshipWinnerStandings.java'
      - 'src/main/resources/db/changelog/changes/2026-11-08-community-championship-awards.yaml'
  workflow_dispatch:
jobs:
  policy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AES_ENCRYPTION_KEY: abc123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test championship entitlement policy
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=CommunityChampionshipPlanPolicyTest,ChampionshipCustomScoringPolicyTest,ChampionshipCustomScoringPersistenceContractTest,CommunityChampionshipServiceTest,ChampionshipWinnerStandingsTest,ChampionshipPlacementPointsPolicyTest,ChampionshipFinalizationPolicyTest,CommunityChampionshipStandingsCalculatorTest,CommunityChampionshipTeamsServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
