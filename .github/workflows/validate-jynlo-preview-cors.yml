name: Jynlo staging CORS allowlist safety

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify credential-safe exact Jynlo CORS origins
        run: |
          chmod +x ./mvnw
          ./mvnw -B -q -Dtest=SecurityCorsAllowlistTest test
