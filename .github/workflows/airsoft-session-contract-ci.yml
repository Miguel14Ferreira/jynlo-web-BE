name: Jynlo Airsoft session contract CI

on:
  workflow_dispatch:

jobs:
  airsoft-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AES_ENCRYPTION_KEY: abc123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend and run Airsoft contract tests
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=AirsoftGameTypeTest,SessionAirsoftGameTypeTest,SessionViewMapperPrivacyTest,CreateSessionRequestValidationTest -Dsurefire.failIfNoSpecifiedTests=false test
