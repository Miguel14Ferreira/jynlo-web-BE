name: Jynlo Airsoft session contract CI

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/airsoft-session-contract-ci.yml'
      - 'pom.xml'
      - 'src/main/java/com/example/desporto24/enumeration/AirsoftGameType.java'
      - 'src/main/java/com/example/desporto24/model/Session.java'
      - 'src/main/java/com/example/desporto24/model/dto/session/CreateSessionRequest.java'
      - 'src/main/java/com/example/desporto24/model/dto/session/SessionSummaryResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/session/SessionDetailResponse.java'
      - 'src/main/java/com/example/desporto24/service/impl/SessionServiceImpl.java'
      - 'src/main/java/com/example/desporto24/service/SessionViewMapper.java'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/main/resources/db/changelog/changes/2026-11-08-session-airsoft-game-type.yaml'
      - 'src/test/java/com/example/desporto24/enumeration/AirsoftGameTypeTest.java'
      - 'src/test/java/com/example/desporto24/model/SessionAirsoftGameTypeTest.java'
      - 'src/test/java/com/example/desporto24/service/SessionViewMapperPrivacyTest.java'
  workflow_dispatch:

jobs:
  airsoft-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AES_ENCRYPTION_KEY: abc123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend and run Airsoft contract tests
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=AirsoftGameTypeTest,SessionAirsoftGameTypeTest,SessionViewMapperPrivacyTest -Dsurefire.failIfNoSpecifiedTests=false test
