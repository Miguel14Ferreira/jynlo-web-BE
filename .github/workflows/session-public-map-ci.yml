name: Jynlo public session map CI
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/session-public-map-ci.yml'
      - 'pom.xml'
      - 'src/main/java/com/example/desporto24/model/dto/session/SessionSummaryResponse.java'
      - 'src/main/java/com/example/desporto24/service/impl/SessionServiceImpl.java'
      - 'src/main/java/com/example/desporto24/service/SessionDiscoveryLocationGrid.java'
      - 'src/test/java/com/example/desporto24/service/SessionDiscoveryServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/SessionDiscoveryLocationGridTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-session-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AES_ENCRYPTION_KEY: abc123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test public map positions and private discovery isolation
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=SessionDiscoveryServiceTest,SessionDiscoveryLocationGridTest -Dsurefire.failIfNoSpecifiedTests=false test
