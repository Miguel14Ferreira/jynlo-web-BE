name: Jynlo private chat rich media CI
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  rich-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and validate secure video audio and document uploads
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=PrivateChatFileStorageTest,DirectChatAttachmentServiceTest test
