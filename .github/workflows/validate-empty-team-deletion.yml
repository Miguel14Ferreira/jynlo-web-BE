name: Jynlo safe empty-team deletion CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check empty-team deletion and existing team membership guards
        run: |
          # The hosted runner already includes Maven; avoid downloading the wrapper
          # distribution from Maven Central (intermittent HTTP 429 rate limits).
          mvn -B -q -Dtest=SportsTeamDeletionServiceTest,SportsTeamInvitationDecisionTest test
