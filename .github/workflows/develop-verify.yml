# Two checks on develop:
# - compile (main + tests): the failure that blocked Render builds on
#   2026-11-20. Required to stay green.
# - full test suite: informational until it is reliably green on H2.
name: Jynlo BE develop verify

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: be-develop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile main and test sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -q test-compile

  tests:
    name: Full test suite (informational)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
