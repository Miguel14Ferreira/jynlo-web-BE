# Two checks on develop:
# - compile (main + tests): the failure that blocked Render builds on
#   2026-11-20. Required to stay green.
# - full test suite: green since 2026-11-21 (2630 tests); a failure now fails the check.
name: Jynlo BE develop verify

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: be-develop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile main and test sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -q test-compile

  tests:
    name: Full test suite
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Test-only key (the real one lives in Render; key + userId must form a valid AES
      # length, as in the other workflows). Without it every test that
      # encrypts profile data fails before reaching its own assertions.
      AES_ENCRYPTION_KEY: ciKey1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
