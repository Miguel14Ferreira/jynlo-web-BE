name: Push backend safety checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend and test mobile push paths
        run: mvn -B -ntp -Dtest=MobilePushDeviceServiceTest,MobilePushDeliveryServiceTest,MobilePushReceiptPollerTest,MobilePushReceiptPolicyTest test
