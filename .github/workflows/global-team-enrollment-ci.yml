name: Jynlo global team enrollment CI

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/global-team-enrollment-ci.yml'
      - 'src/main/java/com/example/desporto24/service/SportsTeamCompetitionEnrollmentService.java'
      - 'src/main/java/com/example/desporto24/controllers/SportsTeamCompetitionEnrollmentController.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentTeam.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityChampionshipTeam.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityTournamentTeamRepository.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityChampionshipTeamRepository.java'
      - 'src/main/resources/db/changelog/changes/2026-11-15-global-team-competition-entry-links.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/test/java/com/example/desporto24/service/SportsTeamCompetitionEnrollmentServiceTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-team-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test consent-based global team enrollment
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SportsTeamCompetitionEnrollmentServiceTest test
