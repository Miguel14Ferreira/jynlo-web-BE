name: Jynlo global team enrollment CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-team-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test consent-based global team enrollment
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SportsTeamCompetitionEnrollmentServiceTest,SportsTeamChampionshipHonoursServiceTest,SportsTeamHonoursServiceTest test
