name: Jynlo prelaunch team journey CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permanent-team-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AES_ENCRYPTION_KEY: ciKey1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate team creation, captain approval, tournament, season and honours
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp '-Dtest=CommunityTournamentTeamServiceTest,CommunityChampionshipTeamsServiceTest,SportsTeamCompetitionEnrollmentServiceTest,SportsTeamCompetitionInvitationServiceTest,SportsTeamCompetitionApplicationServiceTest,SportsTeamChampionshipHonoursServiceTest,SportsTeamHonoursServiceTest' test
