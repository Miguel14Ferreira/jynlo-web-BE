name: Jynlo unified session editing CI
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  session-details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run session editing regression tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SessionLifecycleServiceTest,SessionManagementControllerTest,SessionContextControllerTest,SessionCreateCrosspostTest,CommunityCompetitionServiceTest,SessionDomainRepositoryTest test
