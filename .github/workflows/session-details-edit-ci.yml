name: Jynlo unified session editing CI
on:
  push:
    branches: [develop]
    paths:
      - 'src/main/java/com/example/desporto24/controllers/SessionController.java'
      - 'src/main/java/com/example/desporto24/controllers/SessionContextController.java'
      - 'src/main/java/com/example/desporto24/service/CommunityCompetitionService.java'
      - 'src/main/java/com/example/desporto24/repository/SessionRepository.java'
      - 'src/main/java/com/example/desporto24/service/impl/SessionServiceImpl.java'
      - 'src/main/java/com/example/desporto24/service/interfaces/SessionService.java'
      - 'src/main/java/com/example/desporto24/service/SessionNotificationService.java'
      - 'src/main/java/com/example/desporto24/enumeration/NotificationType.java'
      - 'src/test/java/com/example/desporto24/service/SessionLifecycleServiceTest.java'
      - 'src/test/java/com/example/desporto24/controllers/SessionManagementControllerTest.java'
      - 'src/test/java/com/example/desporto24/controllers/SessionContextControllerTest.java'
      - 'src/test/java/com/example/desporto24/service/SessionCreateCrosspostTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityCompetitionServiceTest.java'
      - '.github/workflows/session-details-edit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run session editing regression tests
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SessionLifecycleServiceTest,SessionManagementControllerTest,SessionContextControllerTest,SessionCreateCrosspostTest,CommunityCompetitionServiceTest test
