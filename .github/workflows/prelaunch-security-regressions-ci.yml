name: Jynlo prelaunch security regressions

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/prelaunch-security-regressions-ci.yml'
      - 'src/main/java/com/example/desporto24/websocket/ChatRealtimeGateway.java'
      - 'src/main/java/com/example/desporto24/controllers/SessionGuestRequestController.java'
      - 'src/main/java/com/example/desporto24/service/DirectChatAttachmentService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTimelineService.java'
      - 'src/test/java/com/example/desporto24/websocket/ChatRealtimeGatewaySecurityTest.java'
      - 'src/test/java/com/example/desporto24/controllers/SessionGuestRequestControllerValidationTest.java'
      - 'src/test/java/com/example/desporto24/service/DirectChatAttachmentServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTimelineServiceTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-control-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AES_ENCRYPTION_KEY: ciKey1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify WebSocket, guest authorization, and private media access
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp '-Dtest=ChatRealtimeGatewaySecurityTest,SessionGuestRequestControllerValidationTest,DirectChatAttachmentServiceTest,CommunityTimelineServiceTest' test
