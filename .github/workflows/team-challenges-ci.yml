name: Jynlo direct team challenges CI
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  challenges:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AES_ENCRYPTION_KEY: ciKey1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate invitation decisions and protected team deletion
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SportsTeamChallengeServiceTest,SportsTeamDeletionServiceTest test
