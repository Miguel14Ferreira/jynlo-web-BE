name: Jynlo championship-owned competitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test championship isolation and legacy functionality
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp -Dtest=CommunityChampionshipEventServiceTest,CommunityChampionshipServiceTest,ChampionshipLeagueSchedulerTest,ChampionshipCupOpeningDrawTest test
