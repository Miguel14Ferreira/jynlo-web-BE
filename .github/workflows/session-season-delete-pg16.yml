name: Jynlo session season deletion PostgreSQL 16
on:
  push:
    branches: [develop]
    paths:
      - 'scripts/qa_session_season_delete_pg16.sql'
      - '.github/workflows/session-season-delete-pg16.yml'
      - 'src/main/java/com/example/desporto24/repository/SessionRepository.java'
      - 'src/main/java/com/example/desporto24/service/CommunityCompetitionService.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  season-fk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jynlo_season_fk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check season FK deletion and attendance preservation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d jynlo_season_fk_test -v ON_ERROR_STOP=1 -f scripts/qa_session_season_delete_pg16.sql
