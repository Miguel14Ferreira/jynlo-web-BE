name: Jynlo championship placement compile CI
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/championship-placement-compile-ci.yml'
      - 'src/main/java/com/example/desporto24/service/ChampionshipPlacementPointsPolicy.java'
      - 'src/main/java/com/example/desporto24/service/CommunityChampionshipTeamsService.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityChampionshipTeam.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournamentTeam.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityChampionshipTeamRepository.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityChampionshipTeamsResponse.java'
      - 'src/main/resources/db/changelog/changes/2026-11-09-community-championship-teams.yaml'
      - 'src/main/java/com/example/desporto24/service/CommunityChampionshipStandingsCalculator.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityChampionshipStandingsResponse.java'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipStandingsCalculatorTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipServiceTest.java'
      - 'src/main/java/com/example/desporto24/service/CommunityChampionshipService.java'
      - 'src/main/java/com/example/desporto24/configuration/LegacyChampionshipJacksonConfiguration.java'
      - 'src/test/java/com/example/desporto24/configuration/LegacyChampionshipJacksonConfigurationTest.java'
      - 'src/main/java/com/example/desporto24/controllers/CommunityChampionshipController.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityTournament.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/CommunityChampionshipResponse.java'
      - 'src/main/java/com/example/desporto24/model/dto/community/ChampionshipPlacementPointsRequest.java'
      - 'src/main/resources/db/changelog/changes/2026-11-09-community-championship-placement-points.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile application without unrelated test sources
        run: |
          chmod +x mvnw
          ./mvnw -B -Dmaven.test.skip=true compile
      - name: Regression tests for championships and unified session editing
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          ./mvnw -B -ntp -Dtest=LegacyChampionshipJacksonConfigurationTest,CommunityChampionshipServiceTest,CommunityChampionshipHonoursTest,CommunityChampionshipTeamsServiceTest,CommunityChampionshipStandingsCalculatorTest,ChampionshipCustomScoringPersistenceContractTest,ChampionshipFinalizationPolicyTest,SessionLifecycleServiceTest,SessionManagementControllerTest test
