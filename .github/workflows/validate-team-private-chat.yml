name: Validate private team chat
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test team content authorization and attachments
        run: |
          # The hosted runner already includes Maven; avoid downloading the wrapper
          # distribution from Maven Central (intermittent HTTP 429 rate limits).
          mvn -B -q -Dtest=SportsTeamContentServiceTest,SportsTeamReactionServiceTest,SportsTeamAttachmentServiceTest,SportsTeamInvitationDecisionTest,TeamContentRealtimeListenerTest,SportsTeamDirectoryQueryTest,SportsTeamRosterAvatarTest test
