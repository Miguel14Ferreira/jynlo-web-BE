name: Jynlo personal live realtime CI
on:
  push:
    branches: [develop]
    paths:
      - 'src/main/java/com/example/desporto24/service/PersonalLiveService.java'
      - 'src/main/java/com/example/desporto24/controllers/PersonalLiveController.java'
      - 'src/main/java/com/example/desporto24/model/social/PersonalLiveEvent.java'
      - 'src/main/java/com/example/desporto24/repository/social/PersonalLiveChatMessageRepository.java'
      - 'src/main/resources/db/changelog/changes/2026-11-14-personal-live-slow-mode.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/main/java/com/example/desporto24/service/PersonalLiveInteractionService.java'
      - 'src/main/java/com/example/desporto24/websocket/ChatRealtimeGateway.java'
      - 'src/test/java/com/example/desporto24/service/PersonalLiveServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/PersonalLiveInteractionServiceTest.java'
      - '.github/workflows/personal-live-realtime-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-live-realtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-chat-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test personal live permissions and event delivery
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=PersonalLiveServiceTest,PersonalLiveInteractionServiceTest test
      - name: Compile production backend
        run: ./mvnw -B -ntp -DskipTests package
