name: Jynlo personal live realtime CI
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: personal-live-realtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-chat-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test personal live permissions and event delivery
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=PersonalLiveServiceTest,PersonalLiveInteractionServiceTest test
      - name: Compile production backend
        run: ./mvnw -B -ntp -DskipTests package
