name: Venue Lisbon open data (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Lisbon municipal sports facilities
        run: python3 scripts/venue_lisbon/fetch.py
