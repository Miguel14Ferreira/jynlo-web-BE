name: Jynlo community live CI
on:
  push:
    branches: [develop]
    paths:
      - 'src/main/java/com/example/desporto24/service/CommunityLiveService.java'
      - 'src/main/java/com/example/desporto24/controllers/CommunityLiveController.java'
      - 'src/main/java/com/example/desporto24/model/community/CommunityLiveEvent.java'
      - 'src/main/java/com/example/desporto24/repository/community/CommunityLiveEventRepository.java'
      - 'src/test/java/com/example/desporto24/service/CommunityLiveServiceTest.java'
      - 'src/main/resources/db/changelog/changes/2026-11-13-community-live-events.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/workflows/community-live-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  broadcast-permission-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify community live permission and LiveKit token isolation
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=CommunityLiveServiceTest test
