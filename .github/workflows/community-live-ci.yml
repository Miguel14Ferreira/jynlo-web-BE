name: Jynlo community live CI
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: community-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  broadcast-permission-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify community live permission and LiveKit token isolation
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=CommunityLiveServiceTest test
