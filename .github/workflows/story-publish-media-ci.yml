name: Jynlo Story publish and media resilience CI
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  story-media-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Story creation and storage
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=SocialStoryServiceTest,MediaStorageTest test
