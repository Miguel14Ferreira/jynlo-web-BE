name: Jynlo team administration notifications CI
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/team-admin-notifications-ci.yml'
      - 'src/main/java/com/example/desporto24/service/TeamInvitationNotificationService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityTournamentTeamService.java'
      - 'src/main/java/com/example/desporto24/service/CommunityChampionshipTeamsService.java'
      - 'src/main/java/com/example/desporto24/enumeration/NotificationType.java'
      - 'src/main/java/com/example/desporto24/register/Notifications/Notifications.java'
      - 'src/main/resources/db/changelog/changes/2026-11-11-team-administration-notification-types.yaml'
      - 'src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'src/test/java/com/example/desporto24/service/TeamInvitationNotificationServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityTournamentTeamServiceTest.java'
      - 'src/test/java/com/example/desporto24/service/CommunityChampionshipTeamsServiceTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  team-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check team administration and invitation regressions
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=TeamInvitationNotificationServiceTest,CommunityTournamentTeamServiceTest,CommunityChampionshipTeamsServiceTest test
