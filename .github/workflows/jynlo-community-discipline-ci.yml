name: Jynlo community discipline CI
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend and test community warning permissions
        env:
          AES_ENCRYPTION_KEY: ciKey1
        run: bash ./mvnw -B -ntp -Dtest=CommunityDisciplineServiceTest,CommunityWarningAppealServiceTest,CommunityWarningAppealReviewServiceTest,CommunityTournamentSuspensionServiceTest,CommunityTournamentServiceTest,CommunityTournamentTeamServiceTest,CommunityTournamentEligibilityServiceTest test
