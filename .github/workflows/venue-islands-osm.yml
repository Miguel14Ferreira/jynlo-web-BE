name: Venue islands OSM (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  islands:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Madeira and Azores sports venues from OpenStreetMap
        run: python3 scripts/venue_islands/osm_islands.py
