databaseChangeLog:
  - changeSet:
      id: 2026-11-13-story-places-tags
      author: jynlo
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: social_story
            columnName: location_label
      changes:
        - addColumn:
            tableName: social_story
            columns:
              - column:
                  name: location_label
                  type: VARCHAR(160)
              - column:
                  name: tagged_usernames
                  type: VARCHAR(500)
