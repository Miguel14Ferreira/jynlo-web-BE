databaseChangeLog:
  - changeSet:
      id: 2026-11-08-community-championships
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_championship
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: community_id, type: bigint, constraints: {nullable: false}}
              - column: {name: name, type: varchar(120), constraints: {nullable: false}}
              - column: {name: sport, type: varchar(100), constraints: {nullable: false}}
              - column: {name: season_label, type: varchar(50), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_championship_community
        - createTable:
            schemaName: desporto24
            tableName: community_championship_tournament
            columns:
              - column: {name: championship_id, type: bigint, constraints: {nullable: false}}
              - column: {name: tournament_id, type: bigint, constraints: {nullable: false}}
              - column: {name: competition_order, type: int, constraints: {nullable: false}}
        - addPrimaryKey:
            schemaName: desporto24
            tableName: community_championship_tournament
            columnNames: championship_id,tournament_id
            constraintName: pk_championship_tournament
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_tournament
            columnNames: tournament_id
            constraintName: uk_championship_tournament
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_tournament
            baseColumnNames: championship_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship
            referencedColumnNames: id
            constraintName: fk_championship_tournament_championship
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_tournament
            baseColumnNames: tournament_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_tournament
            referencedColumnNames: id
            constraintName: fk_championship_tournament_tournament
