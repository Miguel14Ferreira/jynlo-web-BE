databaseChangeLog:
  - changeSet:
      id: 2026-11-14-profile-media-deletion-outbox
      author: jynlo
      changes:
        - createTable:
            tableName: profile_media_deletion_outbox
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: storage_key
                  type: VARCHAR(800)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_profile_media_deletion_key }
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
        - createIndex:
            tableName: profile_media_deletion_outbox
            indexName: idx_profile_media_outbox_due
            columns:
              - column: { name: next_attempt_at }
