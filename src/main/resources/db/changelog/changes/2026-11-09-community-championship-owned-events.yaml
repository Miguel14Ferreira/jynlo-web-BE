databaseChangeLog:
  - changeSet:
      id: 2026-11-09-community-championship-owned-events
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_championship_event
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: championship_id, type: bigint, constraints: {nullable: false}}
              - column: {name: name, type: varchar(120), constraints: {nullable: false}}
              - column: {name: format, type: varchar(24), constraints: {nullable: false}}
              - column: {name: status, type: varchar(16), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_event
            baseColumnNames: championship_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship
            referencedColumnNames: id
            constraintName: fk_championship_owned_event
        - createIndex:
            schemaName: desporto24
            tableName: community_championship_event
            indexName: idx_championship_owned_event
            columns:
              - column: {name: championship_id}
              - column: {name: created_at}
