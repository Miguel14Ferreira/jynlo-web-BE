databaseChangeLog:
  - changeSet:
      id: 2026-11-08-community-championship-custom-rules
      author: jynlo
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              schemaName: desporto24
              tableName: community_tournament
          - not:
              columnExists:
                schemaName: desporto24
                tableName: community_tournament
                columnName: championship_custom_rules_json
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament
            columns:
              - column:
                  name: championship_custom_rules_json
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: championship_custom_rules_version
                  type: int
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            schemaName: desporto24
            tableName: community_tournament
            columnName: championship_custom_rules_version
        - dropColumn:
            schemaName: desporto24
            tableName: community_tournament
            columnName: championship_custom_rules_json
