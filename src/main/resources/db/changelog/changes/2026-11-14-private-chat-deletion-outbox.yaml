databaseChangeLog:
  - changeSet:
      id: 2026-11-14-private-chat-deletion-outbox
      author: jynlo
      changes:
        - createTable:
            tableName: private_chat_deletion_outbox
            schemaName: desporto24
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: storage_key
                  type: VARCHAR(240)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_private_chat_deletion_key }
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
        - createIndex:
            tableName: private_chat_deletion_outbox
            indexName: idx_private_chat_deletion_due
            schemaName: desporto24
            columns:
              - column: { name: next_attempt_at }
