databaseChangeLog:
  - changeSet:
      id: 2026-11-20-community-followers
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_follow
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: community_id, type: bigint, constraints: {nullable: false}}
              - column: {name: follower_profile_id, type: bigint, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_follow
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_community_follow_community
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_follow
            baseColumnNames: follower_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_community_follow_profile
            onDelete: CASCADE
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_follow
            columnNames: community_id, follower_profile_id
            constraintName: uk_community_follow
        - createIndex:
            schemaName: desporto24
            tableName: community_follow
            indexName: idx_community_follow_profile
            columns:
              - column: {name: follower_profile_id}
