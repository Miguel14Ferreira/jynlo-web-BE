databaseChangeLog:
  - changeSet:
      id: 2026-11-22-sports-team-roster-entry
      author: jynlo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: desporto24
                tableName: sports_team_roster_entry
      changes:
        - createTable:
            schemaName: desporto24
            tableName: sports_team_roster_entry
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: team_id, type: bigint, constraints: {nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: shirt_number, type: integer}
              - column: {name: position, type: varchar(40)}
              - column: {name: profile_id, type: bigint}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: sports_team_roster_entry
            baseColumnNames: team_id
            referencedTableSchemaName: desporto24
            referencedTableName: sports_team
            referencedColumnNames: id
            constraintName: fk_sports_team_roster_team
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: sports_team_roster_entry
            baseColumnNames: profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_sports_team_roster_profile
            onDelete: SET NULL
        - createIndex:
            schemaName: desporto24
            tableName: sports_team_roster_entry
            indexName: idx_sports_team_roster_team
            columns:
              - column: {name: team_id}
