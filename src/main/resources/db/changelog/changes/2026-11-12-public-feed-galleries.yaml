databaseChangeLog:
  - changeSet:
      id: 2026-11-12-public-feed-extra-media
      author: jynlo
      changes:
        - createTable:
            tableName: social_post_extra_media
            columns:
              - column:
                  name: post_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_social_post_extra_media
                    foreignKeyName: fk_social_post_extra_media_post
                    references: social_post(id)
              - column:
                  name: position
                  type: integer
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_social_post_extra_media
              - column:
                  name: media_url
                  type: varchar(1200)
                  constraints:
                    nullable: false
              - column:
                  name: media_storage_key
                  type: varchar(800)
                  constraints:
                    nullable: false
              - column:
                  name: media_mime_type
                  type: varchar(40)
                  constraints:
                    nullable: false
        - createTable:
            tableName: community_timeline_extra_media
            columns:
              - column:
                  name: entry_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_community_timeline_extra_media
                    foreignKeyName: fk_community_timeline_extra_media_entry
                    references: community_timeline_entry(id)
              - column:
                  name: position
                  type: integer
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_community_timeline_extra_media
              - column:
                  name: media_url
                  type: varchar(1200)
                  constraints:
                    nullable: false
              - column:
                  name: media_storage_key
                  type: varchar(800)
                  constraints:
                    nullable: false
              - column:
                  name: media_mime_type
                  type: varchar(40)
                  constraints:
                    nullable: false
