databaseChangeLog:
  - changeSet:
      id: 2026-11-20-sports-team-followers
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: sports_team_follow
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: team_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: follower_profile_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: sports_team_follow
            baseColumnNames: team_id
            referencedTableSchemaName: desporto24
            referencedTableName: sports_team
            referencedColumnNames: id
            constraintName: fk_sports_team_follow_team
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: sports_team_follow
            baseColumnNames: follower_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_sports_team_follow_profile
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: sports_team_follow
            columnNames: team_id, follower_profile_id
            constraintName: uk_sports_team_follow
        - createIndex:
            schemaName: desporto24
            tableName: sports_team_follow
            indexName: idx_sports_team_follow_profile
            columns:
              - column:
                  name: follower_profile_id
