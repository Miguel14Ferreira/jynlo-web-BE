databaseChangeLog:
  - changeSet:
      id: 2026-11-23-venue-booking-url
      author: jynlo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: venue
                columnName: booking_url
      changes:
        - addColumn:
            tableName: venue
            columns:
              - column:
                  name: booking_url
                  type: VARCHAR(500)
              - column:
                  name: free_access
                  type: BOOLEAN
