databaseChangeLog:
  - changeSet:
      id: 2026-11-21-chat-poll-votes
      author: jynlo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: desporto24
                tableName: chat_poll_vote
      changes:
        - createTable:
            schemaName: desporto24
            tableName: chat_poll_vote
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_chat_poll_vote
                    nullable: false
              - column:
                  name: profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: conversation_kind
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: option_index
                  type: SMALLINT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: chat_poll_vote
            columnNames: profile_id,conversation_kind,message_id
            constraintName: uq_chat_poll_vote_actor_message
        - createIndex:
            schemaName: desporto24
            tableName: chat_poll_vote
            indexName: idx_chat_poll_vote_lookup
            columns:
              - column:
                  name: conversation_kind
              - column:
                  name: message_id
