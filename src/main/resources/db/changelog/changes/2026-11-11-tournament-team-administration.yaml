databaseChangeLog:
  - changeSet:
      id: 2026-11-11-tournament-team-administration
      author: jynlo
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament_team
            columns:
              - column: {name: admin_profile_id, type: bigint}
              - column: {name: pending_admin_profile_id, type: bigint}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team
            baseColumnNames: admin_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_tournament_team_admin
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team
            baseColumnNames: pending_admin_profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_tournament_team_pending_admin
