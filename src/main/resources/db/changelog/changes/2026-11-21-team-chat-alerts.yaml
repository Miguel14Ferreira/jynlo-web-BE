databaseChangeLog:
  - changeSet:
      id: 2026-11-21-notification-sports-team
      author: jynlo
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: notifications
            columns:
              - column: {name: sports_team_id, type: bigint}
  - changeSet:
      id: 2026-11-21-chat-read-cursor-team
      author: jynlo
      changes:
        - sql:
            dbms: postgresql
            sql: |-
              ALTER TABLE desporto24.chat_read_cursor DROP CONSTRAINT IF EXISTS ck_chat_read_cursor_kind;
              ALTER TABLE desporto24.chat_read_cursor
              ADD CONSTRAINT ck_chat_read_cursor_kind
              CHECK (conversation_kind IN ('direct', 'community', 'session', 'private', 'team'));
