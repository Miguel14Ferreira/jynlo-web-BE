databaseChangeLog:
  - changeSet:
      id: 2026-11-09-community-championship-owned-event-teams
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_championship_event_team
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: event_id, type: bigint, constraints: {nullable: false}}
              - column: {name: championship_team_id, type: bigint, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_event_team
            baseColumnNames: event_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_event
            referencedColumnNames: id
            constraintName: fk_champ_event_team_event
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_event_team
            baseColumnNames: championship_team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_team
            referencedColumnNames: id
            constraintName: fk_champ_event_team_team
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_event_team
            columnNames: event_id,championship_team_id
            constraintName: uk_championship_event_team
        - createIndex:
            schemaName: desporto24
            tableName: community_championship_event_team
            indexName: idx_champ_event_team_team
            columns:
              - column: {name: championship_team_id}
