databaseChangeLog:
  - changeSet:
      id: 2026-11-13-personal-live-events
      author: jynlo
      changes:
        - createTable:
            tableName: personal_live_event
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: host_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ended_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: host_heartbeat_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: personal_live_event
            baseColumnNames: host_profile_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_personal_live_host
        - sql:
            sql: "CREATE UNIQUE INDEX ux_personal_live_host_active ON personal_live_event(host_profile_id) WHERE status = 'LIVE'"
