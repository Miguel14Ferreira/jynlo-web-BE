databaseChangeLog:
  - changeSet:
      id: 2026-11-10-social-activity-interactions
      author: jynlo
      changes:
        - addColumn:
            tableName: social_post
            columns:
              - column:
                  name: activity_type
                  type: VARCHAR(32)
