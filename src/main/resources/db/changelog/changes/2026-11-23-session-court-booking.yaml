databaseChangeLog:
  - changeSet:
      id: 2026-11-23-session-court-booking
      author: jynlo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: session_court_booking
      changes:
        - createTable:
            tableName: session_court_booking
            columns:
              - column:
                  name: session_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_session_court_booking
                    nullable: false
                    foreignKeyName: fk_session_court_booking_session
                    references: session(id)
                    deleteCascade: true
              - column:
                  name: booking_url
                  type: VARCHAR(500)
              - column:
                  name: booked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: booked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
