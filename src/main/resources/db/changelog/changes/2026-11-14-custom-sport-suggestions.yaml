databaseChangeLog:
  - changeSet:
      id: 2026-11-14-custom-sport-suggestions
      author: jynlo
      changes:
        - createTable:
            tableName: custom_sport_suggestion
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: normalized_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: usage_count
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: first_requested_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_requested_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: custom_sport_suggestion
            columnNames: normalized_name
            constraintName: ux_custom_sport_suggestion_name
