databaseChangeLog:
  - changeSet:
      id: 2026-11-09-community-championship-placement-points
      author: jynlo
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              schemaName: desporto24
              tableName: community_tournament
          - not:
              columnExists:
                schemaName: desporto24
                tableName: community_tournament
                columnName: championship_place_points
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament
            columns:
              - column:
                  name: championship_place_points
                  type: varchar(120)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            schemaName: desporto24
            tableName: community_tournament
            columnName: championship_place_points
