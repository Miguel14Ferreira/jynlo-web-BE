databaseChangeLog:
  - changeSet:
      id: 2026-11-13-profile-privacy
      author: jynlo
      changes:
        - addColumn:
            tableName: profile
            columns:
              - column:
                  name: is_private_profile
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createTable:
            tableName: profile_follow_request
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: requester_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: profile_follow_request
            columnNames: requester_id, target_id
            constraintName: uk_profile_follow_request
        - addForeignKeyConstraint:
            baseTableName: profile_follow_request
            baseColumnNames: requester_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_follow_request_requester
        - addForeignKeyConstraint:
            baseTableName: profile_follow_request
            baseColumnNames: target_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_follow_request_target
