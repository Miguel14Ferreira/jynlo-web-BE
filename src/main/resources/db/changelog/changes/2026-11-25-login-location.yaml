databaseChangeLog:
  - changeSet:
      id: 2026-11-25-login-location
      author: jynlo
      changes:
        - createTable:
            tableName: login_location
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, primaryKeyName: pk_login_location, nullable: false}}
              - column: {name: profile_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: country, type: VARCHAR(2)}
              - column: {name: city, type: VARCHAR(120)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addForeignKeyConstraint: {baseTableName: login_location, baseColumnNames: profile_id, referencedTableName: profile, referencedColumnNames: id, constraintName: fk_login_location_profile, onDelete: CASCADE}
        - createIndex:
            tableName: login_location
            indexName: ix_login_location_profile_created
            columns:
              - column: {name: profile_id}
              - column: {name: created_at}
