databaseChangeLog:
  - changeSet:
      id: 2026-11-09-community-championship-teams
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_championship_team
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: championship_id, type: bigint, constraints: {nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: normalized_name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_team
            baseColumnNames: championship_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship
            referencedColumnNames: id
            constraintName: fk_championship_team_championship
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_team
            columnNames: championship_id,normalized_name
            constraintName: uk_championship_team_name
        - addColumn:
            schemaName: desporto24
            tableName: community_tournament_team
            columns:
              - column:
                  name: championship_team_id
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_tournament_team
            baseColumnNames: championship_team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_team
            referencedColumnNames: id
            constraintName: fk_tournament_team_championship_team
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_tournament_team
            columnNames: tournament_id,championship_team_id
            constraintName: uk_tournament_championship_team
