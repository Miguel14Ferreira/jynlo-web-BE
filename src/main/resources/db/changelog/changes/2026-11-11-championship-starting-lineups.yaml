databaseChangeLog:
  - changeSet:
      id: 2026-11-11-championship-starting-lineups
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_championship_lineup_player
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: fixture_id, type: bigint, constraints: {nullable: false}}
              - column: {name: team_id, type: bigint, constraints: {nullable: false}}
              - column: {name: profile_id, type: bigint, constraints: {nullable: false}}
              - column: {name: selection, type: varchar(10), constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_lineup_player
            columnNames: fixture_id,profile_id
            constraintName: uk_championship_lineup_fixture_profile
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_lineup_player
            baseColumnNames: fixture_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_fixture
            referencedColumnNames: id
            constraintName: fk_championship_lineup_fixture
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_lineup_player
            baseColumnNames: team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_team
            referencedColumnNames: id
            constraintName: fk_championship_lineup_team
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_lineup_player
            baseColumnNames: profile_id
            referencedTableSchemaName: desporto24
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_championship_lineup_profile
