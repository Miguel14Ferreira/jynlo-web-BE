databaseChangeLog:
  - changeSet:
      id: 2026-11-12-story-private-replies
      author: jynlo
      changes:
        - createTable:
            tableName: social_story_reply
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: story_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: recipient_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: content
                  type: VARCHAR(500)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: social_story_reply
            baseColumnNames: sender_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_story_reply_sender
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: social_story_reply
            baseColumnNames: recipient_id
            referencedTableName: profile
            referencedColumnNames: id
            constraintName: fk_story_reply_recipient
            onDelete: CASCADE
        - createIndex:
            tableName: social_story_reply
            indexName: idx_story_reply_recipient_created
            columns:
              - column: { name: recipient_id }
              - column: { name: created_at }
