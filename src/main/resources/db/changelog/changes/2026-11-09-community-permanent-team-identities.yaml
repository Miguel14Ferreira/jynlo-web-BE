databaseChangeLog:
  - changeSet:
      id: 2026-11-09-community-permanent-team-identities
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_permanent_team
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: community_id, type: bigint, constraints: {nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: normalized_name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_permanent_team
            baseColumnNames: community_id
            referencedTableSchemaName: desporto24
            referencedTableName: community
            referencedColumnNames: id
            constraintName: fk_permanent_team_community
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_permanent_team
            columnNames: community_id,normalized_name
            constraintName: uk_permanent_team_community_name
        - addColumn:
            schemaName: desporto24
            tableName: community_championship_team
            columns:
              - column:
                  name: permanent_team_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_team
            baseColumnNames: permanent_team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_permanent_team
            referencedColumnNames: id
            constraintName: fk_championship_team_permanent_team
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_team
            columnNames: championship_id,permanent_team_id
            constraintName: uk_championship_permanent_team
