databaseChangeLog:
  - changeSet:
      id: 2026-11-09-championship-cup-byes
      author: jynlo
      changes:
        - createTable:
            schemaName: desporto24
            tableName: community_championship_cup_bye
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: event_id, type: bigint, constraints: {nullable: false}}
              - column: {name: team_id, type: bigint, constraints: {nullable: false}}
              - column: {name: slot_number, type: int, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_cup_bye
            baseColumnNames: event_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_event
            referencedColumnNames: id
            constraintName: fk_owned_cup_bye_event
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_cup_bye
            baseColumnNames: team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_team
            referencedColumnNames: id
            constraintName: fk_owned_cup_bye_team
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_cup_bye
            columnNames: event_id,team_id
            constraintName: uk_champ_cup_bye_team
        - addUniqueConstraint:
            schemaName: desporto24
            tableName: community_championship_cup_bye
            columnNames: event_id,slot_number
            constraintName: uk_champ_cup_bye_slot
