databaseChangeLog:
  - changeSet:
      id: 2026-11-11-championship-owned-league-finalization
      author: jynlo
      changes:
        - addColumn:
            schemaName: desporto24
            tableName: community_championship_event
            columns:
              - column: {name: finalized_at, type: timestamp with time zone}
              - column: {name: winner_team_id, type: bigint}
              - column: {name: winner_team_name, type: varchar(120)}
        - addForeignKeyConstraint:
            baseTableSchemaName: desporto24
            baseTableName: community_championship_event
            baseColumnNames: winner_team_id
            referencedTableSchemaName: desporto24
            referencedTableName: community_championship_team
            referencedColumnNames: id
            constraintName: fk_championship_event_winner_team
