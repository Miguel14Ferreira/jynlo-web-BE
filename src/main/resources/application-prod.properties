spring.config.import=file:/etc/secrets/r2.properties
# Production profile.
# Environment-specific infrastructure values must be supplied at runtime.

# Create every bean at startup (2 GiB plan). Lazy creation was a 512 MiB-era trade-off: the port opened
# sooner, but the first requests after each deploy built controllers, repositories and Hibernate on demand
# and took 2-10 s (JYNLO_SLOW_REQUEST bursts right after every new instance). Now the port opens only when
# the app is ready, so Render keeps serving from the old instance until then.
spring.main.lazy-initialization=false
spring.mvc.servlet.load-on-startup=1

# This service runs on the Render 1c-2g plan (2 GiB). The default Hikari pool can retain
# too many idle connections and associated thread/native allocations.
# Allow an override after load testing without changing other environments.
spring.datasource.hikari.maximum-pool-size=${JYNLO_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${JYNLO_DB_POOL_MIN_IDLE:2}
# Keep warm connections for a few minutes so a quiet spell does not make the next request open new ones.
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Production media must use durable object storage. Never silently fall back to
# the ephemeral Render filesystem.
desporto.media.provider=s3

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.liquibase.default-schema=${DB_SCHEMA:public}
spring.liquibase.liquibase-schema=${DB_SCHEMA:public}

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

management.endpoint.health.show-details=never

# Read-only SNID coverage check after application readiness; no database writes.
desporto.venues.snid.validate-on-ready=${SNID_VALIDATE_ON_READY:true}
